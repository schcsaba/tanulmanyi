# version: '3.8'  # Version is obsolete in newer Docker Compose

services:
  db:
    image: mysql:8.0
    container_name: tanulmanyi_db_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - tanulmanyi_network
    # Don't expose database port in production

  web:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: tanulmanyi_web_prod
    restart: always
    volumes:
      - static_volume_prod:/app/static
      - media_volume_prod:/app/media
    env_file:
      - .env.prod
    depends_on:
      - db
    networks:
      - tanulmanyi_network

  nginx:
    image: nginx:alpine
    container_name: tanulmanyi_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume_prod:/app/static:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - tanulmanyi_network

volumes:
  mysql_data_prod:
  static_volume_prod:
  media_volume_prod:

networks:
  tanulmanyi_network:
    driver: bridge